<!-- jinja2 -->
{% extends "main.html" %} {% block content %}

<form action="{{url_for('add_task')}}" method="POST">
  <div class="textInput">
    <input type="text" name="task" placeholder="Enter your tasks" required />
    <button>Add Task</button>
  </div>
</form>
{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

<ul>
  {% for task in tasks %}

  <li class="{% if task.completed %}
        completed
        {% endif %}">
    <div class="left">
      <a href="{{url_for('completed_task',id = task.id)}}">
        {{task.text}}
      </a>
    </div>

    <div class="right">
      <a href="{{url_for('edit_task', id = task.id)}}" class="edit"> Edit </a>

      <a href="{{url_for('delete_task', id = task.id)}}" class="del">
        Delete
      </a>
    </div>
  </li>

  {% endfor %}
</ul>
{% endblock %}
